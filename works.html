<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works - Peterilliant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --brand-turquoise: #40E0D0; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0a0a0a; 
            color: #ffffff; 
            margin: 0; 
            cursor: url("images/pointer.png"), auto; 
            overflow-x: hidden;
        }
        a, button { cursor: url("images/finger_pointer.png"), pointer !important; outline: none; }
        .filter-btn { transition: all 0.3s ease; position: relative; opacity: 0.4; cursor: pointer; }
        .filter-btn.active { opacity: 1; color: var(--brand-turquoise); }
        .filter-btn.active::after {
            content: ''; position: absolute; bottom: -8px; left: 50%; 
            transform: translateX(-50%); width: 4px; height: 4px; 
            background-color: var(--brand-turquoise); border-radius: 50%;
        }
        .work-card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); display: block; cursor: pointer; }
        .card-media-container {
            width: 100%; height: 300px; overflow: hidden;
            border-radius: 12px; background: #111; position: relative;
        }
        @media (min-width: 768px) { .card-media-container { height: 450px; } }
        .work-image-placeholder { width: 100%; height: 100%; object-fit: cover; transition: 0.5s ease; }
        .work-card:hover .work-image-placeholder { filter: grayscale(100%); opacity: 0.6; transform: scale(1.03); }
        #hovering-board { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.98); z-index: 9999; 
            display: none; justify-content: center; overflow-y: auto;
            backdrop-filter: blur(10px);
        }
        .board-content { width: 90%; max-width: 1100px; padding: 100px 0; position: relative; }
        .board-close { position: fixed; top: 40px; right: 40px; font-size: 40px; cursor: pointer; z-index: 10000; color: white; opacity: 0.5; transition: 0.3s; }
        .board-close:hover { opacity: 1; color: var(--brand-turquoise); }
        .board-img { width: 100%; height: auto; margin-bottom: 40px; border-radius: 4px; }
        .board-video-wrapper { width: 100%; aspect-ratio: 16/9; margin-bottom: 40px; background: #000; }
        .board-pdf-btn { 
            display: block; width: fit-content; margin: 60px auto; padding: 18px 45px; 
            border: 1px solid var(--brand-turquoise); color: var(--brand-turquoise); 
            font-weight: 900; font-size: 12px; letter-spacing: 0.3em; 
            transition: 0.3s; text-transform: uppercase; text-decoration: none;
        }
        .board-pdf-btn:hover { background: var(--brand-turquoise); color: black; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        body.modal-open { overflow: hidden; }
    </style>
</head>
<body>
    <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-md p-4">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html"><img src="images/logo.png" alt="Logo" class="h-8 filter invert" /></a>
            <div class="space-x-8 text-white uppercase text-xs font-bold hidden md:flex">
                <a href="index.html" class="hover:text-[#40E0D0] transition opacity-50">Back to Home</a>
                <a href="works.html" class="text-[#40E0D0]">Works</a>
                <a href="taste.html" class="hover:text-[#40E0D0] transition">Taste</a>
                <a href="about.html" class="hover:text-[#40E0D0] transition">About</a>
                <a href="contact.html" class="hover:text-[#40E0D0] transition">Contact</a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-20 text-left">
        <h1 class="text-6xl md:text-8xl font-black uppercase mb-16 tracking-tighter">Works</h1>
        <div class="flex justify-start space-x-12 mb-20 text-[11px] font-black uppercase tracking-[0.4em] overflow-x-auto pb-4 no-scrollbar">
            <button onclick="filterWorks('all')" class="filter-btn active" id="all-btn">All</button>
            <button onclick="filterWorks('motion')" class="filter-btn" id="motion-btn">Motion</button>
            <button onclick="filterWorks('stills')" class="filter-btn" id="stills-btn">Stills</button>
            <button onclick="filterWorks('graphics')" class="filter-btn" id="graphics-btn">Graphics</button>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12" id="works-grid"></div>
    </main>

    <div id="hovering-board" onclick="closeBoard()">
        <span class="board-close" onclick="closeBoard()">&times;</span>
        <div class="board-content" onclick="event.stopPropagation()">
            <div id="board-media-container"></div>
        </div>
    </div>

    <script>
        // 사용자님이 직접 긁어오신 진짜 데이터 100% 반영
        let allProjects = [
            {
                title: "AirPods pro3 X Zootopia 2 Concept AD",
                category: "Motion",
                media_type: "YouTube",
                media_ref: "b9d9R1PL2Bo",
                order: 1
            },
            {
                title: "Superegg Concept AD",
                category: "Motion",
                media_type: "YouTube",
                media_ref: "Kph_BC-W22w",
                order: 2
            },
            {
                title: "Hwayo Concept AD",
                category: "Motion",
                media_type: "YouTube",
                media_ref: "RWHfIuJJ3H0",
                order: 3
            },
            {
                title: "Fragrance",
                category: "Stills",
                media_type: "Image",
                media_ref: "Frag_1.jpg",
                order: 4,
                stills: ["Frag_1.jpg", "Frag_2.jpg", "Frag_3.jpg", "Frag_5.jpg", "Frag_6.jpg", "Frag_7.jpg"]
            },
            {
                title: "Recycular Magazine School Project",
                category: "Graphics",
                media_type: "Image",
                media_ref: "Recycular_thumb.jpg",
                graphics_pdf: "https://indd.adobe.com/view/c76f5a91-4dc7-436c-9ece-2e85e07cc55b",
                order: 5
            }
        ];

        function renderGrid() {
            const grid = document.getElementById('works-grid');
            if(!grid) return;
            grid.innerHTML = ''; 
            allProjects.sort((a, b) => a.order - b.order);
            allProjects.forEach((data, index) => {
                const card = document.createElement('div');
                card.className = `work-card ${data.category.toLowerCase()}`;
                card.onclick = () => openBoard(index);
                
                let thumbSrc = '';
                if (data.media_type === 'YouTube') {
                    thumbSrc = `https://img.youtube.com/vi/${data.media_ref}/maxresdefault.jpg`;
                } else {
                    thumbSrc = `images/works/${data.media_ref.split('/').pop()}`;
                }

                card.innerHTML = `
                    <div class="card-media-container shadow-2xl">
                        <img src="${thumbSrc}" class="work-image-placeholder" onerror="this.src='images/works/Frag_1.jpg'">
                    </div>
                    <div class="mt-5 px-1">
                        <p class="text-[9px] text-[#40E0D0] font-black uppercase tracking-[0.2em]">${data.category}</p>
                        <h3 class="text-lg font-black uppercase">${data.title}</h3>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openBoard(index) {
            const data = allProjects[index];
            const container = document.getElementById('board-media-container');
            container.innerHTML = '';
            
            if (data.media_type === 'YouTube') {
                container.innerHTML += `<div class="board-video-wrapper"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${data.media_ref}?autoplay=1&rel=0" frameborder="0" allowfullscreen></iframe></div>`;
            } 
            
            if (data.title === 'Fragrance') {
                data.stills.forEach(img => {
                    container.innerHTML += `<img src="images/works/${img}" class="board-img">`;
                });
            } else if (data.media_type === 'Image') {
                container.innerHTML += `<img src="images/works/${data.media_ref.split('/').pop()}" class="board-img">`;
            }

            if (data.graphics_pdf) {
                container.innerHTML += `<a href="${data.graphics_pdf}" target="_blank" class="board-pdf-btn">VIEW FULL PROJECT (PDF)</a>`;
            }

            document.getElementById('hovering-board').style.display = 'flex';
            document.body.classList.add('modal-open');
        }

        function closeBoard() {
            document.getElementById('board-media-container').innerHTML = ''; 
            document.getElementById('hovering-board').style.display = 'none';
            document.body.classList.remove('modal-open');
        }

        function filterWorks(category) {
            const cards = document.querySelectorAll('.work-card');
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(category + '-btn').classList.add('active');
            cards.forEach(card => {
                card.style.display = (category === 'all' || card.classList.contains(category)) ? 'block' : 'none';
            });
        }
        window.onload = renderGrid;
    </script>
</body>
</html>
