backend:
  name: git-gateway
  branch: main

media_folder: "images/works"
public_folder: "images/works"

collections:
  - name: "projects"
    label: "Portfolio Works"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Project Title", name: "title", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["Motion", "Stills", "Graphics", "Taste"] }
      - { label: "Media Type", name: "media_type", widget: "select", options: ["YouTube", "Image"] }
      - { label: "Main Media (YouTube ID or Image Filename)", name: "media_ref", widget: "string", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Display Order", name: "order", widget: "number", default: 10 }
      - { label: "Show on Main Page", name: "show_on_main", widget: "boolean", default: false }
      
      - label: "Stills Images"
        name: "stills"
        widget: "list"
        fields:
          - { label: "Image", name: "image", widget: "image" }
        required: false

      - { label: "Graphics PDF Link", name: "graphics_pdf", widget: "string", required: false, hint: "Adobe Publish Online https://indd.adobe.com/view/c76f5a91-4dc7-436c-9ece-2e85e07cc55b" }

      - label: "Taste Images"
        name: "taste_images"
        widget: "list"
        fields:
          - { label: "Image", name: "image", widget: "image" }
        required: false