<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Taste - Peterilliant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --brand-turquoise: #40E0D0; }
        body { font-family: 'Inter', sans-serif; background-color: #0a0a0a; color: #ffffff; margin: 0; cursor: url("images/pointer.png"), auto; scroll-behavior: smooth; }
        a, button { cursor: url("images/finger_pointer.png"), pointer !important; outline: none; }
        .section-title { font-size: 0.75rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5em; color: var(--brand-turquoise); margin-bottom: 2rem; border-left: 2px solid var(--brand-turquoise); padding-left: 1rem; }
        .masonry-grid { column-count: 2; column-gap: 1.5rem; width: 100%; display: none; }
        .masonry-grid.active { display: block; }
        @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
        @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }
        .taste-item { break-inside: avoid; margin-bottom: 1.5rem; border-radius: 12px; overflow: hidden; transition: 0.5s; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: block; background: #111; }
        .taste-item img { width: 100%; transition: 0.5s; display: block; }
        .taste-item:hover img { filter: grayscale(100%); opacity: 0.5; }
        .taste-item:hover { transform: scale(0.98); border-color: var(--brand-turquoise); }
        .nav-link { opacity: 0.4; transition: 0.3s; cursor: pointer; }
        .nav-link.active { opacity: 1; color: var(--brand-turquoise); }
        #hovering-board { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 9999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .board-content { width: 90%; max-width: 1100px; position: relative; }
        .board-close { position: fixed; top: 40px; right: 40px; font-size: 40px; cursor: pointer; z-index: 10000; color: white; opacity: 0.5; }
        .board-video-wrapper { width: 100%; aspect-ratio: 16/9; background: #000; }
        .loader { border: 2px solid #222; border-top: 2px solid var(--brand-turquoise); border-radius: 50%; width: 20px; height: 20px; animation: spin 0.8s linear infinite; display: inline-block; margin-left: 10px; vertical-align: middle; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header class="sticky top-0 z-50 bg-black/90 backdrop-blur-md p-4">
        <nav class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html"><img src="images/logo.png" alt="Logo" class="h-8 filter invert" /></a>
            <div class="space-x-8 uppercase text-xs font-bold hidden md:flex">
                <a href="index.html" onclick="sessionStorage.setItem('skipIntro', 'true')" class="hover:text-[#40E0D0] transition opacity-50">Back to Home</a>
                <a href="works.html" class="hover:text-[#40E0D0] transition">Works</a>
                <a href="taste.html" class="text-[#40E0D0]">Taste</a>
                <a href="about.html" class="hover:text-[#40E0D0] transition">About</a>
                <a href="contact.html" class="hover:text-[#40E0D0] transition">Contact</a>
            </div>
        </nav>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-20">
        <h1 class="text-6xl md:text-8xl font-black uppercase mb-16 tracking-tighter text-left">Taste</h1>
        
        <div class="flex justify-start space-x-12 mb-20 text-[11px] font-black uppercase tracking-[0.4em]">
            <span id="btn-videos" class="nav-link active" onclick="showSection('videos')">Videos</span>
            <span id="btn-graphics" class="nav-link" onclick="showSection('graphics')">Graphics</span>
        </div>

        <section id="videos-section">
            <h2 class="section-title">Videos <span id="loading-videos" class="loader"></span></h2>
            <div id="video-grid" class="masonry-grid active"></div>
        </section>

        <section id="graphics-section" class="hidden">
            <h2 class="section-title">Graphics <span id="loading-graphics" class="loader"></span></h2>
            <div id="graphics-grid" class="masonry-grid"></div>
        </section>
    </main>

    <div id="hovering-board" onclick="closeBoard()">
        <span class="board-close" onclick="closeBoard()">&times;</span>
        <div class="board-content" onclick="event.stopPropagation()">
            <div id="board-media-container"></div>
        </div>
    </div>

    <script>
        function showSection(type) {
            const vSec = document.getElementById('videos-section');
            const gSec = document.getElementById('graphics-section');
            const vGrid = document.getElementById('video-grid');
            const gGrid = document.getElementById('graphics-grid');
            const vBtn = document.getElementById('btn-videos');
            const gBtn = document.getElementById('btn-graphics');

            if (type === 'videos') {
                vSec.classList.remove('hidden'); gSec.classList.add('hidden');
                vGrid.classList.add('active'); gGrid.classList.remove('active');
                vBtn.classList.add('active'); gBtn.classList.remove('active');
            } else {
                vSec.classList.add('hidden'); gSec.classList.remove('hidden');
                vGrid.classList.remove('active'); gGrid.classList.add('active');
                vBtn.classList.remove('active'); gBtn.classList.add('active');
            }
        }

        // 1. 유튜브 로직 보강
        async function fetchYoutube() {
            const grid = document.getElementById('video-grid');
            const loader = document.getElementById('loading-videos');
            const playlistId = 'PLxzd-BVdaE31qUOCVWhUYktazWLdiRXJ1';
            const rssUrl = `https://www.youtube.com/feeds/videos.xml?playlist_id=${playlistId}`;
            
            // 캐시를 완전히 무시하도록 강력한 랜덤 파라미터 추가
            const api_url = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}&nocache=${Math.random()}`;

            try {
                const res = await fetch(api_url);
                const data = await res.json();
                if (loader) loader.style.display = 'none';
                if (data.status === 'ok' && data.items) {
                    grid.innerHTML = '';
                    data.items.forEach(item => {
                        const videoId = item.link.split('v=')[1]?.split('&')[0] || item.guid.split(':').pop();
                        const card = document.createElement('div');
                        card.className = 'taste-item';
                        card.onclick = () => openBoard(videoId);
                        card.innerHTML = `<img src="https://img.youtube.com/vi/${videoId}/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/${videoId}/hqdefault.jpg'">`;
                        grid.appendChild(card);
                    });
                }
            } catch (e) { if (loader) loader.style.display = 'none'; }
        }

        // 2. 핀터레스트 로직 보강
        async function fetchPinterest() {
            const grid = document.getElementById('graphics-grid');
            const loader = document.getElementById('loading-graphics');
            const feedUrl = "https://www.pinterest.com/sunghwapeter/graphic.rss";
            
            // AllOrigins 프록시의 자체 캐시를 깨기 위해 랜덤 값 추가
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(feedUrl)}&timestamp=${Date.now()}`;

            try {
                const response = await fetch(proxyUrl);
                const data = await response.json();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(data.contents, "text/xml");
                const items = xmlDoc.querySelectorAll("item");

                if (loader) loader.style.display = 'none';
                grid.innerHTML = '';

                items.forEach(item => {
                    const link = item.querySelector("link").textContent;
                    const description = item.querySelector("description").textContent;
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = description;
                    const imgTag = tempDiv.querySelector('img');
                    let src = imgTag ? imgTag.getAttribute('src') : "";

                    if (src) {
                        src = src.replace('236x', 'originals').replace('736x', 'originals');
                        const card = document.createElement('div');
                        card.className = 'taste-item';
                        card.innerHTML = `<a href="${link}" target="_blank"><img src="${src}" loading="lazy" onerror="this.src='${src.replace('originals', '736x')}'"></a>`;
                        grid.appendChild(card);
                    }
                });
            } catch (e) { if (loader) loader.style.display = 'none'; }
        }

        // 3. 실행 시점 보강: 페이지가 조금이라도 준비되면 바로 실행
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => { fetchYoutube(); fetchPinterest(); });
        } else {
            fetchYoutube();
            fetchPinterest();
        }

        function openBoard(id) {
            document.getElementById('board-media-container').innerHTML = `<div class="board-video-wrapper"><iframe class="w-full h-full" src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe></div>`;
            document.getElementById('hovering-board').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }
        function closeBoard() {
            document.getElementById('board-media-container').innerHTML = '';
            document.getElementById('hovering-board').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onload = () => { fetchYoutube(); fetchPinterest(); };
    </script>
</body>
</html>
